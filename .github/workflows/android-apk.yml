name: Build NotHub Pro APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'AndroidStudio_Project/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: AndroidStudio_Project
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NotHub-Pro-debug-APK
          path: AndroidStudio_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
